<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5">
        <div class="form-shell">
            <span class="eyebrow">Actualizar registro</span>
            <h1>Editar estudiante</h1>
            <p class="subtitle">Modifica los datos y guarda los cambios.</p>
            <section class="content-card form-card">
                {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
                <form action="{{ url_for('actualizar_estudiante') }}" method="POST">
                    <input type="hidden" name="id_estudiante" value="{{ estudiante.id_estudiante }}">
                    <div class="mb-4">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ estudiante.nombre }}" maxlength="100" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" value="{{ estudiante.email }}" maxlength="100" required>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-success">Actualizar</button>
                        <a href="{{ url_for('ver_estudiante', id_estudiante=estudiante.id_estudiante) }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
